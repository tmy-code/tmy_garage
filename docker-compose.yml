# For Synology Container Manager: Project > Create > paste this file.
# Adjust the left side of "volumes" to a folder on your NAS, and the left side of "ports" if 3010 is taken.
services:
  garage:
    image: ghcr.io/tmy-code/tmy_garage:latest
    # Without this, "Build" in Container Manager reuses the image already on the NAS.
    pull_policy: always
    container_name: tmy_garage
    restart: unless-stopped
    ports:
      - "3010:3000"
    volumes:
      - /volume1/docker/tmy_garage:/data
    # Todoist sync (optional). Keep the token out of this repository: put it in a file that exists only on the server.
    # env_file: /path/on/your/server/todoist.env   # lines: TODOIST_API_TOKEN=... and, optionally, TODOIST_PROJECT_ID=...
