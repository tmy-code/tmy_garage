<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2937" media="(prefers-color-scheme: light)" />
    <!-- Browsers use the first matching tag, so the phone (OLED) one comes first. -->
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark) and (pointer: coarse)" />
    <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>TMY Garage</title>
    <!-- Matches the app's background so opening it never flashes white before the styles load. -->
    <style>
      body { margin: 0; background: #f3f4f6; }
      @media (prefers-color-scheme: dark) { body { background: #111827; } }
      @media (prefers-color-scheme: dark) and (pointer: coarse) { body { background: #000000; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
